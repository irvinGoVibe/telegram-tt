name: Publish desktop release

on:
  workflow_dispatch:
    inputs:
      releaseNotes:
        description: 'Кратко опишите, что обновлено в этой версии'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release-date: ${{ steps.metadata.outputs.release-date }}
      release-name: ${{ steps.metadata.outputs.release-name }}
      tag-name: ${{ steps.metadata.outputs.tag-name }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(sed -nE 's/^version = "([^"]+)"/\1/p' tauri/Cargo.toml | head -n 1)

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid application version in tauri/Cargo.toml: $VERSION"
            exit 1
          fi

          TAG_NAME="telegram-tasks-v${VERSION}"
          RELEASE_NAME="Telegram Tasks v${VERSION}"
          RELEASE_DATE=$(date -u +'%d.%m.%Y')

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')

            if [ "$IS_DRAFT" != "true" ]; then
              echo "Release $TAG_NAME already exists"
              exit 1
            fi

            echo "Reusing draft release $TAG_NAME"
          fi

          echo "release-date=$RELEASE_DATE" >> "$GITHUB_OUTPUT"
          echo "release-name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag-name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-application:
    name: Build ${{ matrix.settings.name }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles dmg --config {"bundle":{"macOS":{"signingIdentity":"-"}}}'
          - name: macOS Intel
            platform: macos-latest
            args: '--target x86_64-apple-darwin --bundles dmg --config {"bundle":{"macOS":{"signingIdentity":"-"}}}'
          - name: Windows
            platform: windows-latest
            args: '--bundles nsis'
    runs-on: ${{ matrix.settings.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.11'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Build and upload application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ needs.prepare-release.outputs.tag-name }}
          releaseName: ${{ needs.prepare-release.outputs.release-name }}
          releaseBody: 'Сборка приложения загружается. Страница релиза будет заполнена автоматически.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          releaseAssetNamePattern: 'Telegram-Tasks-v[version]-[platform]-[arch][ext]'
          args: ${{ matrix.settings.args }}

  publish-release:
    name: Publish release
    needs: [prepare-release, build-application]
    runs-on: ubuntu-latest
    steps:
      - name: Add release information and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DATE: ${{ needs.prepare-release.outputs.release-date }}
          RELEASE_NOTES: ${{ inputs.releaseNotes }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag-name }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        shell: bash
        run: |
          RELEASE_JSON=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets)
          DOWNLOAD_LINKS=$(echo "$RELEASE_JSON" | jq -r '
            .assets
            | sort_by(.name)
            | .[]
            | select(.name | test("\\.(dmg|exe)$"))
            | "- [\(.name)](\(.url))"
          ')

          if [ -z "$DOWNLOAD_LINKS" ]; then
            echo "No application installers found in release $TAG_NAME"
            exit 1
          fi

          RELEASE_BODY="$RUNNER_TEMP/telegram-tasks-release.md"
          {
            printf '# Telegram Tasks v%s\n\n' "$VERSION"
            printf '**Дата релиза:** %s  \n' "$RELEASE_DATE"
            printf '**Версия:** %s\n\n' "$VERSION"
            printf '## Что обновлено\n\n%s\n\n' "$RELEASE_NOTES"
            printf '## Скачать приложение\n\n%s\n' "$DOWNLOAD_LINKS"
          } > "$RELEASE_BODY"

          gh release edit "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "$RELEASE_BODY" \
            --draft=false \
            --latest
